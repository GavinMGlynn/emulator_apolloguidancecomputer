name: ci

# The probe/golden regression is emulated machine state measured in AGC timing
# pulses, so it must be bit-identical on every platform and build type. A
# platform where a golden differs has a real bug (UB, width assumptions). We
# build and test both the debug (-O0) and release presets. Only ext/unity is
# needed: the checked-in goldens mean CI needs neither the vendored oracles nor
# any downloaded core rope.

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init ext/unity
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build python3
      - run: cmake --preset linux-ci      && cmake --build --preset linux-ci
      - run: ctest --preset linux-ci      --output-on-failure
      - run: cmake --preset linux-release && cmake --build --preset linux-release
      - run: ctest --preset linux-release --output-on-failure

  rocky:
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      # git has to exist BEFORE actions/checkout. Nothing is preinstalled in
      # this image, and with no git the checkout silently falls back to a REST
      # tarball download — no .git directory — after which the submodule step
      # dies with "fatal: not a git repository" and the failure points at the
      # wrong line entirely. CRB is needed for ninja-build; python3 and git are
      # not implied by anything. (emulator-setup-guide.md section 3, which
      # documents this exact trap; we walked into it anyway.)
      - run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y clang cmake ninja-build git python3
      # The checkout is owned by a different user than the container runs as.
      - run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - run: git submodule update --init ext/unity
      - run: cmake --preset linux-ci && cmake --build --preset linux-ci
      - run: ctest --preset linux-ci --output-on-failure

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init ext/unity
      - run: brew install ninja
      - run: cmake --preset macos-ci      && cmake --build --preset macos-ci
      - run: ctest --preset macos-ci      --output-on-failure
      - run: cmake --preset macos-release && cmake --build --preset macos-release
      - run: ctest --preset macos-release --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init ext/unity
      - uses: ilammy/msvc-dev-cmd@v1
      - run: choco install ninja -y
      - run: cmake --preset windows-ci && cmake --build --preset windows-ci
      - run: ctest --preset windows-ci --output-on-failure
